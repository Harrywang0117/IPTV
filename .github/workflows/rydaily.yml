name: 每日解析在线本地包

# 定时链路：两日一更备分接口 → 每日解析在线本地包 → 每日聚合TVBox直播源 → 接口扫描处理工具
# 只有第一个是定时触发，后面每个都在上一个跑完后才启动（不论成败），保证顺序
on:
  # 上一个工作流跑完（不论成败）后自动开始
  workflow_run:
    workflows: ["两日一更备分接口"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "强制执行（忽略日期/频率限制，立即运行）"
        required: false
        type: boolean
        default: false
      debug:
        description: "详细调试日志"
        required: false
        type: boolean
        default: false

concurrency:
  group: tvbox-repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests urllib3

      - name: 运行 ry下载器
        run: |
          ARGS=""
          ${{ github.event.inputs.debug == 'true' && 'ARGS="$ARGS --debug"' || '' }}
          ${{ github.event.inputs.force == 'true' && 'ARGS="$ARGS --force"' || '' }}
          python python/ry下载器.py $ARGS

      - name: 提交产物
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add ry/
          git commit -m "chore(ry): 每日更新本地包 $(TZ='CST-8' date +%Y-%m-%d)" || echo "no changes"
          git push
